<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaveYes</title>
<meta name="description" content="事件表模型的波形编辑器：边沿可拖、逐信号配色、能讲也能改。单文件离线可用。">
<meta name="app-version" content="v2-m0">
<style>
@import url('https://registry.npmmirror.com/lxgw-wenkai-webfont/latest/files/lxgwwenkaimono-regular.css');
@import url('https://registry.npmmirror.com/lxgw-wenkai-webfont/latest/files/lxgwwenkai-regular.css');

/* ===== 主题 token：浅色为默认（与 V1 的 data-theme="light" 对齐），深色舞台在 body[data-theme=dark] ===== */
:root {
  --bg:#EEF1F6; --panel:#FFFFFF; --panel-2:#F6F8FB; --raise:#EDF1F7;
  --line:#CBD5E4; --line-soft:#E2E8F2; --text:#1B2536; --muted:#54637F; --faint:#6E7D96;
  --acc:#0E9F6E; --acc-text:#0B7A55; --acc-ink:#032B1E; --amber:#B45309; --info:#0369A1; --danger:#DC2626;
  --ch1:#059669; --ch2:#0284C7; --ch3:#B45309; --ch4:#DB2777; --ch5:#7C3AED; --ch6:#E11D48;
  --sel:rgba(14,159,110,.22); --hover-veil:rgba(70,100,150,.10); --raise-hover:#E3E9F2;
  --grid-major:#C3CFE0; --grid-minor:#E4EAF3; --wave-bg:#F6F8FB; --xbox:#64748B;
  --r-lg:10px; --r-md:8px; --r-sm:6px;
  --font-ui:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"LXGW WenKai Mono","Cascadia Code",Consolas,"Noto Sans Mono CJK SC",monospace;
  --shadow-pop:0 14px 38px rgba(30,50,90,.18),0 2px 8px rgba(30,50,90,.12);
  --mask:rgba(20,35,60,.45);
  color-scheme:light;
}
body[data-theme="dark"] {
  --bg:#0F1520; --panel:#161E2C; --panel-2:#111825; --raise:#1D2738;
  --line:#2E3D56; --line-soft:#212C3E; --text:#E7EDF7; --muted:#9FB0CC; --faint:#8496B4;
  --acc:#10B981; --acc-text:#34D399; --acc-ink:#052016; --amber:#FBBF24; --info:#38BDF8; --danger:#F87171;
  --ch1:#34D399; --ch2:#38BDF8; --ch3:#FBBF24; --ch4:#F472B6; --ch5:#A78BFA; --ch6:#FB7185;
  --sel:rgba(16,185,129,.30); --hover-veil:rgba(150,180,230,.12); --raise-hover:#243149;
  --grid-major:#28344A; --grid-minor:#1B2434; --wave-bg:#111825; --xbox:#64748B;
  --shadow-pop:0 16px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.40);
  --mask:rgba(4,8,16,.62);
  color-scheme:dark;
}

* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; font-family:var(--font-ui); font-size:12.5px; color:var(--text); background:var(--bg);
       overflow:hidden; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; cursor:pointer; }
.mono { font-family:var(--font-mono); }
.sp { flex:1; }

.app { height:100%; display:flex; flex-direction:column; }

/* ===== 顶栏 ===== */
.topbar { height:48px; flex:0 0 48px; background:var(--panel); border-bottom:1px solid var(--line);
          display:flex; align-items:center; gap:10px; padding:0 12px; position:relative; z-index:20; }
.mark { font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--acc-text); white-space:nowrap; }
.mark b { color:var(--text); font-weight:600; }
.docname { font-family:var(--font-mono); font-size:12.5px; background:var(--raise); border:1px solid var(--line-soft);
           border-radius:var(--r-sm); padding:3px 8px; display:flex; align-items:center; gap:6px; white-space:nowrap;
           max-width:260px; overflow:hidden; text-overflow:ellipsis; }
.docname input { all:unset; font:inherit; width:12ch; }
.dirty { width:6px; height:6px; border-radius:50%; background:var(--amber); flex:0 0 6px; }
.seg { display:flex; background:var(--raise); border:1px solid var(--line-soft); border-radius:var(--r-md); padding:2px; }
.seg button { border:0; background:transparent; padding:4px 13px; border-radius:6px; font-size:12px; color:var(--muted); }
.seg button.on { background:var(--panel); color:var(--acc-text); font-weight:600; box-shadow:0 1px 3px rgba(30,50,90,.12); }
.seg button[disabled] { opacity:.45; cursor:not-allowed; }
.btn { height:28px; padding:0 10px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel);
       font-size:12px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.btn:hover { background:var(--raise-hover); }
.btn.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
.btn.pri:hover { filter:brightness(1.06); background:var(--acc); }
.icb { width:28px; height:28px; border:1px solid var(--line-soft); border-radius:var(--r-sm); background:var(--panel);
       display:inline-flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; flex:0 0 28px; padding:0; }
.icb:hover { background:var(--raise-hover); color:var(--text); }
.icb.on { background:var(--sel); color:var(--acc-text); border-color:rgba(14,159,110,.4); }
.menuwrap { position:relative; }
.menu { position:absolute; right:0; top:32px; min-width:196px; background:var(--panel); border:1px solid var(--line);
        border-radius:var(--r-md); box-shadow:var(--shadow-pop); padding:5px; display:none; z-index:30; }
.menu.open { display:block; }
.menu h5 { margin:6px 8px 3px; font-size:10.5px; font-weight:600; color:var(--faint); letter-spacing:.06em; }
.menu button { display:flex; width:100%; align-items:center; gap:8px; border:0; background:transparent; text-align:left;
               padding:6px 8px; border-radius:var(--r-sm); font-size:12px; }
.menu button:hover { background:var(--raise-hover); }
.menu button i { margin-left:auto; font-style:normal; color:var(--faint); font-size:10.5px; font-family:var(--font-mono); }
.menu hr { border:0; border-top:1px solid var(--line-soft); margin:4px 2px; }

/* ===== 三列骨架 ===== */
.cols { flex:1; display:flex; min-height:0; }
.tree { width:212px; flex:0 0 212px; background:var(--panel-2); border-right:1px solid var(--line);
        display:flex; flex-direction:column; min-height:0; }
.pane-h { height:30px; flex:0 0 30px; display:flex; align-items:center; gap:6px; padding:0 10px; font-size:11.5px;
          color:var(--faint); border-bottom:1px solid var(--line-soft); letter-spacing:.04em; }
.pane-h .cnt { margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--faint); }
.tbody { flex:1; overflow:auto; padding:4px 0 10px; }
.trow { display:flex; align-items:center; gap:6px; padding:4px 10px 4px 12px; font-size:12px; cursor:default; }
.trow:hover { background:var(--hover-veil); }
.trow.sel { background:var(--sel); }
.trow .dot { width:8px; height:8px; border-radius:2px; flex:0 0 8px; }
.trow .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trow .kd { font-size:10px; color:var(--faint); font-family:var(--font-mono); }
.trow.off { opacity:.42; }
.trow.g { color:var(--muted); font-weight:600; padding-left:6px; }
.trow .eye { border:0; background:transparent; color:var(--faint); font-size:11px; padding:0 2px; }
.trow .eye:hover { color:var(--text); }
.tfoot { flex:0 0 auto; border-top:1px solid var(--line-soft); padding:7px 8px; display:flex; gap:6px; }
.tfoot .btn { flex:1; justify-content:center; }

.props { width:250px; flex:0 0 250px; background:var(--panel-2); border-left:1px solid var(--line);
         display:flex; flex-direction:column; min-height:0; }
.pbody { flex:1; overflow:auto; padding:10px; }
.field { margin-bottom:11px; }
.lab { display:block; font-size:10.5px; color:var(--faint); margin-bottom:4px; letter-spacing:.03em; }
.inp { height:26px; padding:0 8px; border:1px solid var(--line-soft); border-radius:var(--r-sm); background:var(--panel);
       display:flex; align-items:center; font-family:var(--font-mono); font-size:11.5px; gap:6px; }
.inp input { all:unset; flex:1; min-width:0; font:inherit; }
.mini-seg { display:flex; background:var(--raise); border:1px solid var(--line-soft); border-radius:var(--r-sm); padding:2px; flex-wrap:wrap; }
.mini-seg button { flex:1; border:0; background:transparent; font-size:11px; padding:3px 4px; border-radius:4px; color:var(--muted); white-space:nowrap; }
.mini-seg button.on { background:var(--panel); color:var(--acc-text); font-weight:600; }
.trow2 { display:flex; align-items:center; gap:8px; }
.tog { width:30px; height:17px; border-radius:9px; background:var(--line); position:relative; border:0; padding:0; flex:0 0 30px; transition:background .12s; }
.tog i { position:absolute; left:2px; top:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left .12s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.tog.on { background:var(--acc); }
.tog.on i { left:15px; }
.swrow { display:flex; gap:5px; flex-wrap:wrap; }
.sw { width:18px; height:18px; border-radius:4px; box-shadow:inset 0 0 0 1px rgba(15,23,42,.10); border:0; padding:0; position:relative; }
.sw.on { box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--text); }
.sw.auto { background:var(--raise); color:var(--faint); font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
/* 自定义取色器：彩虹底 + 中间一个当前色圆点，和预设色块一眼区分开 */
input[type="color"].sw { background:
    conic-gradient(from 45deg, #ef4444, #f59e0b, #10b981, #0ea5e9, #8b5cf6, #ec4899, #ef4444); }
input[type="color"].sw::-webkit-color-swatch-wrapper { padding:0; }
input[type="color"].sw::-webkit-color-swatch { border:none; border-radius:0; opacity:0; }
.swsep { width:1px; background:var(--line-soft); margin:1px 3px; }
.hint { font-size:11px; color:var(--faint); line-height:1.5; }

/* ===== 画布 ===== */
.stagewrap { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
.scroll { flex:1; overflow:auto; position:relative; background:var(--wave-bg); }
.content { position:relative; display:block; }
svg.waves { position:absolute; z-index:1; display:block; }
.ruler { position:sticky; top:0; z-index:4; display:flex; height:32px; background:var(--wave-bg);
         border-bottom:1px solid var(--line); }
.corner { position:sticky; left:0; z-index:5; background:var(--wave-bg); border-right:1px solid var(--line);
          display:flex; align-items:center; padding:0 8px; font-family:var(--font-mono); font-size:10.5px; color:var(--faint); }
.rulbody { flex:0 0 auto; }
.rulbody svg { display:block; }
.row { display:flex; border-bottom:1px solid var(--grid-minor); }
.row.hi { background:var(--hover-veil); }
.nm-cell { position:sticky; left:0; z-index:3; background:var(--wave-bg); border-right:1px solid var(--line);
           display:flex; align-items:center; gap:6px; padding:0 8px; font-size:12px; overflow:hidden; }
.nm-cell .dot { width:8px; height:8px; border-radius:2px; flex:0 0 8px; }
.nm-cell .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nm-cell .k { margin-left:auto; font-family:var(--font-mono); font-size:9.5px; color:var(--faint); flex:0 0 auto; }
.vv-cell { position:sticky; z-index:3; background:var(--wave-bg); border-right:1px solid var(--line);
           display:flex; align-items:center; justify-content:flex-end; padding:0 8px; font-family:var(--font-mono); font-size:11.5px; }
.grow { display:flex; align-items:center; gap:6px; background:var(--panel-2); border-bottom:1px solid var(--line);
        position:relative; z-index:2; font-size:11.5px; color:var(--muted); font-weight:600; padding:0 8px; }
.grow .tw { width:14px; text-align:center; cursor:pointer; color:var(--faint); }
.grow .cnt { margin-left:auto; font-family:var(--font-mono); font-weight:400; font-size:10.5px; color:var(--faint); }
.vspacer { pointer-events:none; }

.rail { position:absolute; top:40px; right:16px; z-index:12; display:flex; gap:2px; padding:3px;
        background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-pop); }
.rail button { width:28px; height:26px; border:0; background:transparent; border-radius:5px; color:var(--muted); font-size:13px;
               display:flex; align-items:center; justify-content:center; }
.rail button:hover { background:var(--raise-hover); color:var(--text); }
.rail button.on { background:var(--sel); color:var(--acc-text); }
.rail svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.35; stroke-linecap:round; stroke-linejoin:round; }
.rail .sep { width:1px; background:var(--line-soft); margin:3px 2px; }
.valpick { position:absolute; top:74px; right:16px; z-index:12; display:flex; gap:3px; padding:4px;
           background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-pop); align-items:center; }
.valpick button { min-width:26px; height:24px; border:1px solid var(--line-soft); background:var(--panel); border-radius:5px;
                  font-family:var(--font-mono); font-size:11.5px; padding:0 5px; }
.valpick button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
.valpick input { width:74px; height:24px; border:1px solid var(--line-soft); border-radius:5px; background:var(--raise);
                 font-family:var(--font-mono); font-size:11.5px; padding:0 6px; color:var(--text); }

.status { flex:0 0 26px; height:26px; background:var(--panel); border-top:1px solid var(--line);
          display:flex; align-items:center; gap:14px; padding:0 10px; font-size:11px; color:var(--muted); }
.status .mono { font-family:var(--font-mono); }
.chip { padding:2px 7px; border:1px solid var(--line-soft); border-radius:20px; font-size:10.5px; background:var(--panel-2); }
.chip.on { background:var(--sel); border-color:rgba(14,159,110,.35); color:var(--acc-text); }

.empty[hidden] { display: none; }
.empty { position:absolute; inset:32px 0 26px; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:9px; color:var(--faint); pointer-events:none; font-size:12.5px; text-align:center; line-height:1.9; z-index:2; }
.empty b { color:var(--muted); font-weight:600; }

.toast { position:fixed; left:50%; bottom:44px; transform:translateX(-50%); background:var(--panel); color:var(--text);
         border:1px solid var(--line); box-shadow:var(--shadow-pop); border-radius:var(--r-md); padding:8px 14px; font-size:12px;
         z-index:99; max-width:70ch; }
.toast.bad { border-color:var(--danger); color:var(--danger); }
#dropmask { position:fixed; inset:0; background:var(--mask); z-index:90; display:none; align-items:center; justify-content:center; }
#dropmask.on { display:flex; }
#dropmask .box { background:var(--panel); border:1.5px dashed var(--acc); border-radius:var(--r-lg); padding:26px 40px; font-size:13px; }
.rep-mask { position:fixed; inset:0; background:var(--mask); z-index:95; display:none; align-items:center; justify-content:center; }
.rep-mask.on { display:flex; }
.rep-mask .rep { width:min(580px,92vw); max-height:min(78vh,620px); display:flex; flex-direction:column;
                 background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-pop); }
.rep-mask .rep-h { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); flex:0 0 auto; }
.rep-mask .rep-h b { font-size:13px; font-weight:600; }
.rep-mask .rep-h .sum { font-family:var(--font-mono); font-size:10.5px; color:var(--faint); }
.rep-mask .rep-h .icb { margin-left:auto; }
.rep-mask .rep-b { overflow:auto; padding:2px 12px 8px; font-size:12px; line-height:1.7; }
.rep-mask .sec { margin-top:10px; }
.rep-mask .sec h6 { margin:0 0 2px; font-size:10.5px; font-weight:600; letter-spacing:.03em; color:var(--muted);
                    display:flex; align-items:baseline; gap:6px; }
.rep-mask .sec h6 .cnt { font-family:var(--font-mono); font-weight:400; color:var(--faint); }
.rep-mask .sec ul { margin:0; padding-left:17px; }
.rep-mask .sec li { margin:1px 0; }
.rep-mask .clean { padding:14px 2px 4px; font-size:12.5px; color:var(--muted); }
.rep-mask .rep-f { display:flex; gap:6px; align-items:center; padding:9px 12px; border-top:1px solid var(--line); flex:0 0 auto; }
.rep-mask .rep-f .sp { margin-left:auto; }
.selftest { position:fixed; left:8px; bottom:34px; z-index:99; background:var(--panel); border:1px solid var(--line);
            border-radius:var(--r-md); padding:8px 10px; font-family:var(--font-mono); font-size:11px; max-height:60%; overflow:auto;
            box-shadow:var(--shadow-pop); display:none; white-space:pre; }
.selftest.on { display:block; }
::-webkit-scrollbar { width:11px; height:11px; }
::-webkit-scrollbar-thumb { background:var(--line); border-radius:6px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="mark">wave<b>yes</b></span>
    <span class="docname" id="docName" title="双击重命名">未命名.wy</span>
    <span class="dirty" id="dirtyDot" hidden></span>
    <div class="seg" id="modeSeg">
      <button class="on" data-mode="edit">编辑</button>
      <button disabled title="M4 展示模式">展示</button>
    </div>
    <div class="sp"></div>
    <button class="btn" data-act="sample">示例</button>
    <button class="btn" data-act="new">新建</button>
    <div class="menuwrap">
      <button class="btn" data-menu="mImport">导入 ▾</button>
      <div class="menu" id="mImport">
        <h5>本阶段可用</h5>
        <button data-act="open-wy">打开 .wy / WaveJSON / .wave…<i>Ctrl+O</i></button>
        <hr>
        <h5>后续里程碑</h5>
        <button disabled>VCD / .vcd.gz<i>M5</i></button>
        <button disabled>.waved（cocotb）<i>M5</i></button>
        <button disabled>FST<i>M8</i></button>
      </div>
    </div>
    <div class="menuwrap">
      <button class="btn" data-menu="mExport">导出 ▾</button>
      <div class="menu" id="mExport">
        <h5>文件</h5>
        <button data-act="save">保存 .wy<i>Ctrl+S</i></button>
        <button data-act="save-as">.wy 另存为…</button>
        <h5>图片</h5>
        <button data-act="png2">PNG 2×<i>Ctrl+Shift+S</i></button>
        <button data-act="png4">PNG 4×</button>
        <button data-act="svg">SVG（内嵌 .wy）</button>
        <hr>
        <h5>兼容</h5>
        <button data-act="export-wj">WaveJSON（先看报告）</button>
        <button disabled>VCD<i>M5</i></button>
      </div>
    </div>
    <button class="btn" data-act="to-v1" title="带着这张图回 V1 编辑：先出兼容性报告，确认了再走">V1</button>
    <button class="icb" data-act="theme" id="themeBtn" title="浅/深舞台">◐</button>
  </header>

  <div class="cols">
    <aside class="tree">
      <div class="pane-h">信号<span class="cnt" id="treeCnt">0</span></div>
      <div class="tbody" id="treeBody"></div>
      <div class="tfoot">
        <button class="btn" data-act="add-sig">＋ 信号</button>
        <button class="btn" data-act="add-group">＋ 分组</button>
      </div>
    </aside>

    <main class="stagewrap">
      <div class="scroll" id="scroll">
        <div class="content" id="content">
          <svg class="waves" id="waves" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="rowbox"></div>
        </div>
      </div>
      <div class="empty" id="empty" hidden>
        <div><b>空白文档</b></div>
        <div>点左下「＋ 信号」开始手画，或把 <span class="mono">.wy</span> 拖进窗口<br>
          快捷键：<span class="mono">f</span> 适配全部 · <span class="mono">g</span> 改网格 · <span class="mono">空格</span> 平移 · <span class="mono">滚轮</span> 以光标为锚缩放</div>
      </div>
      <div class="rail" id="rail">
        <button data-tool="select" title="选择 / 检视（V）"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2" stroke-dasharray="2.6 2.2"/></svg></button>
        <button data-tool="paint" class="on" title="画笔（B）：拖过时刻写事件"><svg viewBox="0 0 16 16"><path d="M11.4 2.3 13.7 4.6 5.9 12.4l-3.3.7.7-3.3z"/><path d="M9.6 4.1 11.9 6.4"/></svg></button>
        <button data-tool="cursor" title="游标（C）：点击钉住 A"><svg viewBox="0 0 16 16"><path d="M8 1.6v12.8"/><path d="M8 5.2 12.6 2.2M8 5.2 12.6 8.2"/></svg></button>
        <span class="sep"></span>

<script>

/* ---------- 0. 小工具 ---------- */

/* ---------- 1. 模型 ---------- */
const KINDS = ['bit', 'bus', 'analog', 'clock'];

    lanes: [], edges: [], bands: [], markers: [],

  tool: 'paint',
  paintVal: 1,
  snap: true,
  sel: null,               // 选中信号 id
  hoverT: null,            // 鼠标下的 tick
  cursorT: 0,              // 钉住的 A
  nameW: 176,
  lane: 44,
  dirty: false,
  fileHandle: null
};

function totalPx() { return Math.max(0, (DOC.time.t1 - DOC.time.t0) * pxps()); }

function tOf(x) { return DOC.time.t0 + x / pxps(); }
function vpW() { return $('#scroll').clientWidth - V.nameW - valW(); }
function valW() { return DOC.view.valueCol ? 74 : 0; }
function snapT(t) {

    amber: g('--amber'), danger: g('--danger'), sel: g('--sel'),
    gridMajor: g('--grid-major'), gridMinor: g('--grid-minor'), waveBg: g('--wave-bg'), xbox: g('--xbox'),
    line: g('--line'), lineSoft: g('--line-soft'), panel: g('--panel'),
    ch: [g('--ch1'), g('--ch2'), g('--ch3'), g('--ch4'), g('--ch5'), g('--ch6')],

function sigColor(sig) {

/* ---------- 4. 绘制 ---------- */
const PADY = 8;
function laneYs() { return { hi: PADY, lo: V.lane - PADY, mid: V.lane / 2 }; }

  let d = '';

    const s = segs[i]; if (!isBit(s.v)) continue;

    else {
      const py = p.v === 1 ? yHi : yLo;

      else { const dx = Math.min(4, Math.max(0, (x1 - x0) / 2)); d += `L${r2(x0 - dx)} ${py}L${r2(x0 + dx)} ${y}L${r2(x1)} ${y}`; }

}

  return `M${r2(x0 + dx)} ${yTop}H${r2(x1 - dx)}L${r2(x1)} ${r2((yTop + yBot) / 2)}L${r2(x1 - dx)} ${yBot}H${r2(x0 + dx)}L${r2(x0)} ${r2((yTop + yBot) / 2)}Z`;

}
function drawRulerSvgInner(a, b, w) {
  const step = rulerStep(Math.max(68 / pxps(), 1)), gs = Math.max(1, DOC.time.grid.step);

  if (gs * pxps() >= 5) for (let t = Math.ceil(a / gs) * gs; t <= b; t += gs) s += `<line x1="${r2(xOf(t))}" y1="26" x2="${r2(xOf(t))}" y2="32" stroke="${TOK.gridMajor}"/>`;

      `<text x="${r2(xOf(t)) + 3}" y="14" style="font-family:${TOK.mono};font-size:10.5px;fill:${TOK.muted}">${esc(fmtT(t, false))}</text>`;
  return s;
}

/* 位图导出：SVG → canvas → PNG，并把 .wy 原文塞进 iTXt（图片拖回来能继续编辑） */
function pngBlob(scale, o) {
  const ex = buildExportSvg(o);
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(new Blob([ex.str], { type: 'image/svg+xml;charset=utf-8' }));
    img.onload = async () => {
      const cv = document.createElement('canvas');
      cv.width = Math.round(ex.w * scale); cv.height = Math.round(ex.h * scale);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = TOK.waveBg; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(async b => {
        if (!b) { rej(new Error('toBlob 返回空')); return; }
        try { res(new Blob([pngInsertITXt(new Uint8Array(await b.arrayBuffer()), WY_PNG_KEYWORD, wyText())], { type: 'image/png' })); }
        catch (e) { res(b); }
      }, 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('SVG 光栅化失败（图太宽？）')); };
    img.src = url;
  });
}
async function exportPng(scale) {

function bindFiles() {
  const inp = $('#fileInput');
  inp.addEventListener('change', async () => { if (inp.files && inp.files[0]) await readFile(inp.files[0]); inp.value = ''; });
  const hasFile = ev => Array.from((ev.dataTransfer && ev.dataTransfer.types) || []).includes('Files');
  window.addEventListener('dragover', ev => { if (hasFile(ev)) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; $('#dropmask').classList.add('on'); } });
  window.addEventListener('dragleave', ev => { if (!ev.relatedTarget) $('#dropmask').classList.remove('on'); });

async function readFile(f) {
  const name = f.name || '';
  try {
    if (/\.(wy|wave|json|txt)$/i.test(name)) { loadAnyText(await f.text(), name); return; }
    if (/\.svg$/i.test(name)) { const t = await f.text(); const j = svgExtractWy(t); if (j && loadWyText(j, name)) return; toast('这个 SVG 里没有内嵌的 .wy 数据', true); return; }
    if (/\.png$/i.test(name)) {

}

/* ---------- 10b. WaveJSON 互通（M1） ---------- */
/* 一个 WaveJSON 网格步 = 多少 tick。取 20 而不是 10：phase 常用的 0.25 / 0.5 偏移、
   u / d 毛刺的格内 1/4 与 3/4 位置，都得落在整数 tick 上（事件表的 t 是整数）。 */
const WJC = 20;
const WJ_DATA_CH = '=23456789';
const WJ_DIGIT_COLOR = { '2': '#FFFFFF', '3': '#FFD500', '4': '#FF7F00', '5': '#0080FF', '6': '#00BFBF', '7': '#00BF00', '8': '#BF00BF', '9': '#FF007F' };

/* 无求值的宽松解析：字符串感知扫描——剥 // 与块注释、补免引号键、单引号串转双引号、
   丢尾逗号——最后交回 JSON.parse。逐字移植自 V1 index.html 的同名函数，改一边要同步另一边；
   hash 分享链接与拖进来的文件都是**不可信输入**，绝不用 Function() 求值。 */
function parseLoose(text) {
  let out = '';
  let expectKey = false;
  let i = 0;
  const n = text.length;
  while (i < n) {
    const c = text[i];
    if (c === '/' && text[i + 1] === '/') { while (i < n && text[i] !== '\n') i++; continue; }
    if (c === '/' && text[i + 1] === '*') {
      i += 2;
      while (i < n && !(text[i] === '*' && text[i + 1] === '/')) i++;
      i += 2;
      continue;
    }
    if (c === '"' || c === "'") {
      out += '"';
      i++;
      while (i < n && text[i] !== c) {
        if (text[i] === '\\') { out += text[i] + (text[i + 1] || ''); i += 2; continue; }
        out += text[i] === '"' ? '\\"' : text[i];
        i++;
      }
      out += '"';
      i++;
      expectKey = false;
      continue;
    }
    if (c === ',') {
      let j = i + 1;
      while (j < n && /\s/.test(text[j])) j++;
      if (text[j] === '}' || text[j] === ']') { i++; continue; }
      out += c;
      i++;
      expectKey = true;
      continue;
    }
    if (c === '{' || c === '[') {
      out += c;
      i++;
      if (c === '{') expectKey = true;
      continue;
    }
    if (expectKey && /[A-Za-z_$]/.test(c)) {
      const m = /^[A-Za-z_$][\w$]*\s*:/.exec(text.slice(i, i + 128));
      if (m) {
        out += '"' + m[0].replace(/\s*:/, '') + '":';
        i += m[0].length;
        expectKey = false;
        continue;
      }
    }
    expectKey = expectKey && /\s/.test(c);
    out += c;
    i++;
  }
  return JSON.parse(out);
}

function wjKindOf(wave) {
  if (/[pnPN]/.test(wave)) return 'clock';
  if (new RegExp('[' + WJ_DATA_CH + ']').test(wave)) return 'bus';
  return 'bit';
}
function wjNewRep() { return { drop: [], merge: [], note: [] }; }
function wjRepCount(rep) { return rep.drop.length + rep.merge.length + rep.note.length; }
function wjRepText(rep) {
  const sec = (t, a) => (a.length ? t + '：\n  · ' + a.join('\n  · ') + '\n' : '');
  return (sec('丢弃', rep.drop) + sec('合并 / 改写', rep.merge) + sec('登记', rep.note)).trim() || '无损失';
}

/* 一条 lane（或一个分组）→ V2 的行。返回 sig / group，同时把有损项记进 rep。 */
function wjEntryToLane(e, rep, depth) {
  if (Array.isArray(e)) {
    const g = newGroup(typeof e[0] === 'string' ? e[0] : '');
    e.slice(1).forEach(x => { const l = wjEntryToLane(x, rep, depth + 1); if (l) g.lanes.push(l); });
    return g;
  }
  if (!e || typeof e !== 'object') { rep.drop.push('一个空行 / 非对象条目（WaveJSON 里 `{}` 或裸字符串）'); return null; }
  const wave = typeof e.wave === 'string' ? e.wave : '';
  const kind = wjKindOf(wave);
  const sig = newSig(String(e.name == null ? '' : e.name), kind, {});
  if (e.name == null || String(e.name) === '') sig.name = '';   // newSig 给空名兜了个 'sig'，导入要按 WaveDrom 留空
  const who = sig.name || '（无名）';
  const period = e.period != null ? (+e.period || 1) : 1;
  const cell = Math.max(1, Math.round(WJC * period));
  const phase = e.phase != null ? (+e.phase || 0) : 0;
  const off = -Math.round(phase * cell);   // V1 render-modern.js: x = -phase × 格宽，正 phase 是把波形往前挪
  const data = Array.isArray(e.data) ? e.data.map(String) : (typeof e.data === 'string' ? e.data.split(/\s+/) : []);
  if (period !== 1) sig.wj = Object.assign(sig.wj || {}, { period: period });
  if (phase) sig.wj = Object.assign(sig.wj || {}, { phase: phase });

  let cur = 'x', di = -1, gap = 0, last = null, excl = 0, weak = 0;
  const labels = [];                       // {k, lab} —— 数据格，第二遍再定值
  const setAt = (t, v) => { if (v !== cur) { sig.events.push({ t: t, v: v }); cur = v; } };
  const half = Math.max(1, Math.round(cell / 2)), q = Math.max(1, Math.round(cell / 4));
  /* 一个大写字形 → 事件。返回 false 表示「不是我能直接落事件的字符」（数据格交调用方）。
     大小写按 V1 render-modern.js 的口径：H/L 是带箭头的 1/0，X/Z 与 x/z 同值（X 只是画得更实）。 */
  function apply(ch, a) {
    if (ch === '0' || ch === 'l' || ch === 'L') { setAt(a, 0); return true; }
    if (ch === '1' || ch === 'h' || ch === 'H') { setAt(a, 1); return true; }
    if (ch === 'x' || ch === 'X') { setAt(a, 'x'); return true; }
    if (ch === 'z' || ch === 'Z') { setAt(a, 'z'); return true; }
    if (ch === 'p' || ch === 'P') { setAt(a, 1); setAt(a + half, 0); return true; }
    if (ch === 'n' || ch === 'N') { setAt(a, 0); setAt(a + half, 1); return true; }
    if (ch === 'u' || ch === 'd') { const back = cur, v = ch === 'u' ? 1 : 0; setAt(a + q, v); setAt(a + cell - q, back); return true; }
    return false;
  }
  for (let k = 0; k < wave.length; k++) {
    const ch = wave[k], a = off + k * cell;
    /* '.' 是「上一格的字形原样再来一遍」，不是「保持上一值」。pp.. 在 WaveDrom 里是连着的四拍时钟，
       当保持值处理的话时钟会在第 2 拍后停在空中 —— 只有格内会跳变的字形需要续，静态字形的 '.' 落在
       已经稳定的电平上，天然等价于不动。 */
    if (ch === '.') { if (last !== null) apply(last, a); continue; }
    if (ch === ' ' || ch === '#' || ch === '|') { gap++; last = null; continue; }
    if (ch === '<' || ch === '>') { excl++; continue; }
    if (ch === 'U' || ch === 'D') { setAt(a, 'x'); weak++; continue; }
    if (WJ_DATA_CH.indexOf(ch) >= 0) {
      di++; labels.push({ k: k, lab: data[di] != null ? data[di] : '', col: ch });
      cur = '@' + di;                     // 占位：数据格的真实取值第二遍才定，这里先让下一格的 x/z 不会被 dedupe 吃掉
      if (ch !== '=') sig.wj = Object.assign(sig.wj || {}, { datacolor: ((sig.wj && sig.wj.datacolor) || []).concat([{ k: k, hex: WJ_DIGIT_COLOR[ch] }]) });
      last = null;                       // 数据块由事件边界撑着，'.' 续它 = 让块变宽，不需要新事件
    } else if (apply(ch, a)) {
      last = ('pnPNud'.indexOf(ch) >= 0) ? ch : null;
      if (ch === 'P' || ch === 'N') rep.drop.push('时钟箭头（P/N 的周期标记）无对应物，只保留了方波本身');
    } else { setAt(a, 'x'); rep.drop.push('未知字符 `' + ch + '`（' + who + ' 第 ' + (k + 1) + ' 格）按 x 处理'); }
  }
  sig._wjEnd = off + wave.length * cell;      // 末尾的 '.' 不产生事件，但格子要占位（只在内存里，不进 .wy）
  if (gap) rep.merge.push(who + '：' + gap + ' 处空档（空格 / # / |）在 V2 里等价于「保持上一值」');
  if (kind === 'bus' && /[01lhHXZ]/.test(wave)) rep.drop.push(who + '：WaveJSON 允许一根线里混用电平字（0/1/x/z）与数据字（=/2…），电平格画成线、数据格画成块；V2 一根线只有一种画法，整条按总线出，电平格会变成数据块 —— 选中它在属性面板把「类型」改成 1 bit 就能整条按电平看，数据格留成没有标签的空方块');
  if (excl) rep.drop.push(who + '：' + excl + ' 个 xclude 标记（< / >）只告诉 WaveDrom「这一格别画起始沿」，V2 无对应物，按保持上一值处理');
  if (weak) rep.drop.push(who + '：' + weak + ' 个 U/D（弱上下拉）官方引擎也没有对应砖，V1 一并画成不确定框，这里按 x 处理');

  /* 数据格定值：WaveJSON 的 data 是**显示文本**，不是数值。能解析成数就存数，
     并把原文登记进取值映射，显示逐字等于 WaveDrom、导出 VCD 又写得出真值；
     纯文本标签只能给合成值（合成值避开已占用的真实数值）。 */
  if (labels.length) {
    const uniq = []; labels.forEach(o => { if (uniq.indexOf(o.lab) < 0) uniq.push(o.lab); });
    const valOf = {}, taken = {};
    /* 字形用掉的真实电平（0 / 1）先占住号：否则 '01=..' 里的 IDLE 会分到 0，
       第 1 格的低电平和最后一格的 IDLE 就成了同一个值。 */
    sig.events.forEach(ev => { if (typeof ev.v === 'number') taken[ev.v] = 1; });
    uniq.forEach(lab => { const v = parseVal(lab, sig); if (v != null && isFinite(v) && taken[v] === undefined) { valOf[lab] = v; taken[v] = 1; } });
    let syn = 0;
    const nextSyn = () => { while (taken[syn] !== undefined) syn++; taken[syn] = 1; return syn++; };
    uniq.forEach(lab => { if (valOf[lab] === undefined) valOf[lab] = nextSyn(); });
    /* 第一遍给数据格挂的 '@序号' 占位只是防去重的记号，不是取值；毛刺字形（u/d）会把它当「回到的电平」
       带进事件表。这一遍统一换成该标签的真值，否则 '@0' 会被当成一个取值画进总线块。 */
    sig.events.forEach(ev => { if (typeof ev.v === 'string' && ev.v.charAt(0) === '@') ev.v = valOf[labels[+ev.v.slice(1)].lab]; });
    sig.map = []; sig.fmt = 'sym';
    /* data 是**显示文本**：WaveJSON 允许只写 =/2/3… 而不给 data，WaveDrom 把砖画成空的，
       V2 跟着留空，不拿合成序号冒充标签（合成序号只进 .wy 的取值映射）。 */
    Object.keys(valOf).forEach(lab => { sig.map.push({ v: valOf[lab], name: lab }); });
    sig.map.sort((m, n2) => m.v - n2.v);
    labels.forEach(o => { sig.events.push({ t: off + o.k * cell, v: valOf[o.lab] }); });   // 数据格一律留事件：总线块的砖缝就在这一格
    normalize(sig);                       // 字形事件在前、数据事件在后，不排序的话 valueAt 的二分直接读错
    const noLab = labels.filter(o => o.lab === '').length;
    if (noLab) rep.note.push(who + '：' + noLab + ' 个数据格在 WaveJSON 里没有对应的 data 标签，V2 与 WaveDrom 一样画空砖（取值仍是合成序号）');
    const texty = uniq.filter(lab => { const v = parseVal(lab, sig); return lab !== '' && (v == null || !isFinite(v)); });
    if (texty.length) rep.note.push(who + '：' + texty.length + ' 个取值是纯文本标签（' + texty.slice(0, 3).join(' / ') + (texty.length > 3 ? ' …' : '') + '），V2 给了合成序号 + 取值映射；导出 VCD 只能写序号');
    if ((sig.wj || {}).datacolor) rep.drop.push(who + '：' + sig.wj.datacolor.length + ' 处数据填色（2–9 数字色）WaveJSON 里是画死的，V2 改由取值映射上色，已原样存在 .wy 里等 M3 用');
  }
  if (typeof e.node === 'string') {
    const nodes = [];
    for (let k = 0; k < e.node.length; k++) if (/[A-Za-z]/.test(e.node[k])) nodes.push({ t: off + k * cell, ch: e.node[k] });
    if (nodes.length) sig.nodes = nodes;
  }
  const known = ['name', 'wave', 'data', 'node', 'period', 'phase', 'datacolor'];
  const extra = {}; let nExtra = 0;
  Object.keys(e).forEach(k => { if (known.indexOf(k) < 0) { extra[k] = e[k]; nExtra++; } });
  if (nExtra) { sig.wj = Object.assign(sig.wj || {}, { extra: extra }); rep.note.push(who + '：' + nExtra + ' 个 V2 暂不认的键（' + Object.keys(extra).join(' / ') + '）原样存在 .wy 的 sig.wj.extra 里，回 V1 时还原'); }
  if (!wave.length) rep.note.push(who + '：没有 wave，按空信号导入');
  return sig;
}

function wjToDoc(j, name) {
  const rep = wjNewRep();
  if (!j || typeof j !== 'object' || Array.isArray(j)) throw new Error('WaveJSON 顶层必须是一个对象');
  if (j.signal !== undefined && !Array.isArray(j.signal)) throw new Error('"signal" 必须是数组');
  const doc = newDoc();

/* 一段文本 → 先当 .wy，再退回 WaveJSON（宽容解析）。两条路都失败才报错。 */
function loadAnyText(txt, name) {   // .wy 优先，认不出再当 WaveJSON；V1 交接、拖文件、Ctrl+O 都走这里
  let o = null; try { o = JSON.parse(txt); } catch (e) { try { o = parseLoose(txt); } catch (e2) { o = null; } }
  if (o && typeof o === 'object' && o.wy === 1) return loadWyText(txt, name);
  if (o && typeof o === 'object') {
    try {
      const r = wjToDoc(o, name ? name.replace(/\.(json|txt|wave)$/i, '') : null);
      DOC = r.doc; undoS.length = redoS.length = 0;
      afterLoad(); clearDirty(); syncName(); showWjRep(r.rep, '导入 ' + (name || 'WaveJSON'));
      return true;
    } catch (e) { toast('不是 .wy，也不是合法 WaveJSON：' + e.message, true); return false; }

/* 报告面板：兼容组（WaveJSON / 回 V1）一律「先出报告再落盘 / 再跳转」，不静默降级（§10 已定）。
   actions 为空 = 纯查看（导入后的那份就是这种）。 */
function showWjRep(rep, title, actions) {
  actions = actions || [];
  if (!wjRepCount(rep)) {
    if (actions.length) runWjAction(actions[0]);
    else toast(title + ' · 形状无损');
    return;
  }
  toast(title + ' · ' + wjRepCount(rep) + ' 项有损/登记，详见报告');
  V.wjRep = rep; V.wjRepTitle = title; V.wjActions = actions;
  $('#wjrepTitle').textContent = title;
  $('#wjrepSum').textContent = '丢弃 ' + rep.drop.length + ' · 改写 ' + rep.merge.length + ' · 登记 ' + rep.note.length;
  $('#wjrepBody').innerHTML = [['丢弃', rep.drop], ['合并 / 改写', rep.merge], ['登记', rep.note]]
    .filter(x => x[1].length)
    .map(x => '<div class="sec"><h6>' + esc(x[0]) + '<span class="cnt">' + x[1].length + '</span></h6><ul>' +
              x[1].map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>').join('');
  $('#wjrepFoot').innerHTML = '<button class="btn" data-act="rep-close">关闭</button><span class="sp"></span>' +
    actions.map((a, i) => '<button class="btn' + (a.primary ? ' pri' : '') + '" data-rep="' + i + '">' + esc(a.label) + '</button>').join('');
  $('#wjrep').classList.add('on');
}

   所以 V2→V1 直接写这个格式。图太大时 URL 会被浏览器截断，退到共享键 + #handoff。
   键名不能碰 'wdgui-doc-v1'：V1 与两个宿主插件都在自动重写它，拿它交接会被覆盖。 */
const WY_HANDOFF_KEY = 'wdgui-handoff-wj';

  const txt = encodeURIComponent(JSON.stringify(json));

  const raw = location.hash.slice(1);

  let txt = '';

    if (raw === 'handoff') { txt = tryGet(WY_HANDOFF_KEY) || ''; try { localStorage.removeItem(WY_HANDOFF_KEY); } catch (e) { } }
    else txt = decodeURIComponent(raw);
  } catch (e) { return false; }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
  if (!txt) { toast('交接链接里带的 hash / 共享键都读不出图（可能已被打开过一次）', true); return false; }
  return loadAnyText(txt, '来自 V1');

  const data = Array.isArray(sig.data) ? sig.data.map(String) : (typeof sig.data === 'string' ? sig.data.split(/\s+/) : []);

    } else pen = null;
    if (ch === ' ' || ch === '#' || ch === '|' || ch === '<' || ch === '>') { push(k, cur, cur, lab); continue; }
    if (ch === 'U' || ch === 'D') { cur = 'x'; lab = null; push(k, 'x', 'x', null); continue; }

    if ('xX'.indexOf(ch) >= 0) { cur = 'x'; lab = null; push(k, 'x', 'x', null); continue; }
    if ('zZ'.indexOf(ch) >= 0) { cur = 'z'; lab = null; push(k, 'z', 'z', null); continue; }
    if (ch === 'p' || ch === 'P') { cur = 0; lab = null; pen = 'p'; push(k, 1, 0, null); continue; }
    if (ch === 'n' || ch === 'N') { cur = 1; lab = null; pen = 'n'; push(k, 0, 1, null); continue; }
    if (ch === 'u' || ch === 'd') { if (cur !== 'D') lab = null; push(k, cur, cur, lab); continue; }

      if (sig.name !== String(e.name == null ? '' : e.name)) { mark(tag + '名字 ' + sig.name + ' vs ' + e.name); return; }
      cells.forEach((c, k) => {
        if (bad || c.skip) return;
        const va = valueAt(sig, c.a), vb = valueAt(sig, c.a + c.cell - 1), at = (k + 1) + ' 格';
        if (c.s === 'D') {
          if (va !== vb) { mark(tag + at + '数据块在格内断开（' + va + ' → ' + vb + '）'); return; }
          const shown = wjLabel(sig, va);
          if (shown !== c.lab) mark(tag + at + '显示 ' + JSON.stringify(shown) + '，WaveDrom 是 ' + JSON.stringify(c.lab));
        } else {
          if (va !== c.s) { mark(tag + at + '格首 ' + va + '，WaveDrom 是 ' + c.s); return; }
          if (vb !== c.e) mark(tag + at + '格尾 ' + vb + '，WaveDrom 是 ' + c.e);
        }
      });
      /* 相邻两个显式数据字符在 WaveDrom 是两块砖：V2 的砖缝靠段边界撑着，用 laneSegs 直接数段 */
      for (let k = 1; k < cells.length && !bad; k++) {
        const c = cells[k], q = cells[k - 1];
        if (c.skip || q.skip || !c.exp || !q.exp || c.a - q.a !== c.cell) continue;
        const n = laneSegs(sig, q.a, c.a + c.cell).length;
        if (n !== 2) mark(tag + (k + 1) + ' 格与前一格并成了 ' + n + ' 块砖（WaveDrom 是两块）');
      }
    });
  });
  ok('V1 的 ' + fixDocs + ' 个示例逐个导入 · ' + fixSigs + ' 条信号 / ' + fixCells + ' 格显示一致', fixBad.length === 0, fixBad.join(' │ '));

  const msg = `selftest ${pass}/${pass + fail} passed${fail ? ' · ' + fail + ' FAILED' : ''}`;
  document.title = msg;
  const el = $('#selftest'); el.className = 'selftest on'; el.textContent = msg + '\n' + out.join('\n');
  console.log(msg); if (fail) console.log(out.filter(l => l.startsWith('FAIL')).join('\n'));
  return { pass, fail };
}

/* ---------- 11b. 交互自检（?selftest=2，需要真实视口）----------
   走的是真事件：点按钮 → 派发 PointerEvent → 断言 DOC 变了，最后跑一遍光栅化。 */
async function uiTest() {
  const out = []; let pass = 0, fail = 0;
  const ok = (n, c, e) => { c ? (pass++, out.push('ok   ' + n)) : (fail++, out.push('FAIL ' + n + (e ? '  → ' + e : ''))); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const sc = $('#scroll');
  sc.setPointerCapture = () => { }; sc.releasePointerCapture = () => { };   // 合成事件没有真 pointerId

  DOC = newDoc(); V.tool = 'paint'; V.paintVal = 1; afterLoad(); render();
  ok('新文档是空的', allSigs().length === 0 && $('#empty').hidden === false);
  ok('空文档提示层可见', getComputedStyle($('#empty')).display !== 'none');

  const add = () => document.querySelector('[data-act="add-sig"]').click();
  add(); add(); render(); await wait(30);
  ok('点「＋ 信号」加了两条', allSigs().length === 2, allSigs().map(s => s.name).join(','));
  ok('加完信号后提示层收起', getComputedStyle($('#empty')).display === 'none');

  const sig = allSigs()[0];
  const clientX = t => sc.getBoundingClientRect().left + V.nameW + valW() - sc.scrollLeft + xOf(t);
  const rowEl = () => document.querySelector('[data-row="' + sig.id + '"]');
  const fire = (type, t) => {
    const r = rowEl().getBoundingClientRect();
    rowEl().dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: clientX(t), clientY: r.top + r.height / 2, button: 0, pointerId: 3, isPrimary: true }));
  };
  fire('pointerdown', 20); fire('pointermove', 40); fire('pointermove', 60); fire('pointerup', 60);
  await wait(40);
  ok('画笔 20→60 写成 1', valueAt(sig, 30) === 1 && valueAt(sig, 59) === 1, JSON.stringify(sig.events));
  ok('画笔区间外仍是 x', valueAt(sig, 70) === 'x');
  V.paintVal = 0;
  fire('pointerdown', 80); fire('pointermove', 100); fire('pointerup', 100); await wait(40);
  ok('再画 0 覆盖 80→100', valueAt(sig, 90) === 0 && valueAt(sig, 110) === 'x');
  ok('画笔后标了脏', $('#dirtyDot').hidden === false);

  /* 缩放以光标为锚 */
  V.zoom = 4; render();
  const anchor = 120, px = clientX(anchor) - sc.getBoundingClientRect().left - V.nameW - valW();
  const tBefore = tOf(sc.scrollLeft + px);
  sc.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: -240, clientX: clientX(anchor), clientY: 200 }));
  await wait(40);
  const tAfter = tOf(sc.scrollLeft + px);
  ok('滚轮放大后锚点时刻不变', V.zoom > 4 && Math.abs(tAfter - tBefore) < 1.5, tBefore.toFixed(1) + ' → ' + tAfter.toFixed(1) + ' zoom=' + V.zoom.toFixed(2));

  /* 键盘流 */
  const key = k => window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
  const g0 = DOC.time.grid.step; key('g'); await wait(20);
  ok('g 改网格步长', DOC.time.grid.step !== g0, g0 + ' → ' + DOC.time.grid.step);
  V.cursorT = 40; key('m'); await wait(20);
  ok('m 加标记旗', DOC.markers.length === 1 && DOC.markers[0].t === 40, JSON.stringify(DOC.markers));
  key('ArrowRight'); await wait(20);
  ok('→ 游标走一格', V.cursorT === 40 + Math.max(1, DOC.time.grid.step), String(V.cursorT));
  V.cursorT = 0; key(']'); await wait(20);
  ok('] 跳到下一个标记', V.cursorT === 40, String(V.cursorT));
  key('['); await wait(20);
  ok('[ 往前没有标记则不动', V.cursorT === 40, String(V.cursorT));
  key('f'); await wait(20);
  ok('f 适配全部', Math.abs((DOC.time.t1 - DOC.time.t0) * pxps() - vpW()) < 6, pxps().toFixed(2));

  /* 撤销 */
  const n0 = allSigs()[0].events.length;
  V.paintVal = 1; fire('pointerdown', 140); fire('pointermove', 160); fire('pointerup', 160); await wait(40);
  const n1 = allSigs()[0].events.length;
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true })); await wait(40);
  ok('Ctrl+Z 撤销画笔', n1 !== n0 && allSigs()[0].events.length === n0, n0 + '/' + n1 + '/' + allSigs()[0].events.length);

  /* 光栅化导出：真的走 canvas */
  const blob = await pngBlob(2, { width: 900, a: 0, b: DOC.time.t1 });
  const bytes = new Uint8Array(await blob.arrayBuffer());
  ok('PNG 光栅化成功', bytes.length > 5000 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47, bytes.length + 'B');
  const back = pngExtractWy(bytes);
  ok('PNG 里的 .wy 能读回来（拖图可续编辑）', !!back && JSON.parse(back).meta.name === DOC.meta.name, back ? 'ok' : 'null');

  /* 拖文件进窗口：.wy 与导出的 PNG 两条路都走真 readFile（异步，所以轮询而不是死等） */
  const painted = JSON.stringify(toWy());
  const waitFor = async (pred, ms) => { const e = Date.now() + (ms || 2500); while (Date.now() < e) { if (pred()) return true; await wait(25); } return false; };
  const drop = async (file) => {
    const dt = new DataTransfer(); dt.items.add(file);
    DOC = newDoc(); render();
    document.querySelectorAll('.toast').forEach(t => t.remove());      // 别拿上一条的 toast 当本次结果
    window.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }));
    return waitFor(() => allSigs().length > 0 || document.querySelector('.toast'));
  };
  await drop(new File([painted], 'painted.wy', { type: 'application/json' }));
  ok('拖 .wy 进窗口能打开（文档名跟文件名）', DOC.meta.name === 'painted' && allSigs().length === 2, DOC.meta.name + ' / ' + allSigs().length);
  await drop(new File([bytes], 'shot.png', { type: 'image/png' }));
  ok('拖导出的 PNG 回来能续编辑', allSigs().length === 2 && valueAt(allSigs()[0], 30) === 1,
    allSigs().length + ' 信号, val@30=' + (allSigs()[0] ? valueAt(allSigs()[0], 30) : '-'));
  await drop(new File(['<?xml?><svg/>'], 'plain.svg'));
  ok('拖无数据的 SVG 会拒绝而不是白屏', allSigs().length === 0 && !!document.querySelector('.toast'));

  /* ---- M1：V1 那边的图进来 / 兼容组报告先行 / 顶栏 V1 交接 ---- */
  await drop(new File(['{ signal: [ { name: "clk", wave: "pp..pn" }, { name: "d", wave: "01x=2", data: ["IDLE"] } ] }'],
    'from-v1.json', { type: 'application/json' }));
  ok('拖 WaveJSON 进窗口走的是同一条打开路径', allSigs().length === 2 && valueAt(allSigs()[0], 45) === 1,
    allSigs().length + ' 信号 · clk@45=' + (allSigs()[0] ? valueAt(allSigs()[0], 45) : '-'));
  ok('导入的图标了来源，值列照事件表出', DOC.meta.origin === 'wavejson' && DOC.time.grid.step === WJC,
    DOC.meta.origin + ' / step=' + DOC.time.grid.step);
  await drop(new File(['{ signal: [ { name: "n", wave: "01" } ] }'], 'legacy.wave'));
  ok('.wave（归 V1 的后缀）在 V2 是只读导入', allSigs().length === 1 && DOC.meta.origin === 'wavejson');

  document.querySelector('[data-act="sample"]').click();
  document.querySelector('[data-act="to-v1"]').click();
  ok('顶栏 V1：先出报告，不当场跳走', $('#wjrep').classList.contains('on') && /兼容性报告/.test($('#wjrepTitle').textContent));
  ok('报告分组列了每一条损失', $$('#wjrep .sec li').length >= 3 && $$('#wjrep .sec h6').length >= 1,
    $$('#wjrep .sec li').length + ' 条');
  ok('报告只给一个主按钮（一屏一件事）', $$('#wjrep .rep-f .btn.pri').length === 1 && $$('#wjrep .rep-f .btn').length === 2);
  const handUrl = v1Url(docToWj(DOC).json);
  ok('交接链接是 V1 认得的 hash，且图在里面', handUrl.indexOf('index.html#') === 0 &&
    JSON.parse(decodeURIComponent(handUrl.slice(11))).signal.length === 4, handUrl.slice(0, 30));
  $('#wjrep').dispatchEvent(new MouseEvent('click', { bubbles: true }));
  ok('点遮罩也能关（Esc 同源逻辑）', !$('#wjrep').classList.contains('on'));

  /* ---- 一根线一种画法，但类型是用户可以整条改的属性（2026-10-10 已定） ---- */
  const mixR = wjToDoc({ signal: [{ name: 'm', wave: '01=2', data: ['A'] }] });
  ok('混排导入的报告除了说降级，还给出去哪改', /只有一种画法/.test(mixR.rep.drop.join(' ')) &&
    /改成 1 bit/.test(mixR.rep.drop.join(' ')), mixR.rep.drop.join(' | ').slice(0, 60));
  const keepUi = DOC; DOC = mixR.doc; V.sel = DOC.lanes[0].id; render(); renderProps();
  document.querySelector('[data-kind="bit"]').click();
  ok('属性面板改类型：整条切回电平，线真的画得出来', DOC.lanes[0].kind === 'bit' &&
    bitPath(laneSegs(DOC.lanes[0], DOC.time.t0, DOC.time.t1), 10, 30).length > 0, DOC.lanes[0].kind);
  DOC.lanes[0].bits = 2; renderProps();
  document.querySelector('[data-kind="bus"]').click();
  ok('切回总线按默认定格式：位宽 ≤2 给 bin', DOC.lanes[0].kind === 'bus' && DOC.lanes[0].fmt === 'bin',
    DOC.lanes[0].kind + ' / ' + DOC.lanes[0].fmt);
  DOC = keepUi; V.sel = null; render(); renderProps();

  const msg = `uiTest ${pass}/${pass + fail} passed${fail ? ' · ' + fail + ' FAILED' : ''}`;
  document.title = msg;
  const el = $('#selftest'); el.className = 'selftest on'; el.textContent = msg + '\n' + out.join('\n');
  console.log(msg); if (fail) console.log(out.filter(l => l.startsWith('FAIL')).join('\n'));
  return { pass, fail };
}
function toWyOf(d) {
  const keep = DOC; DOC = d; const o = toWy(); DOC = keep; return o;
}
function sigById2(doc, name) { return allSigs(doc.lanes).find(s => s.name === name); }
function basePng() {
  /* 1×1 透明 PNG，用来验 iTXt 插拔 */
  const b64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR42mNkAAIAAAoAAv/lxKUAAAAASUVORK5CYII=';
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ---------- 12. 启动 ---------- */
function boot() {
  readTokens();
  const q = new URLSearchParams(location.search);
  if (q.get('demo') === '1') DOC = demoDoc();
  const saved = tryGet('wy-theme'); if (q.get('theme') === 'dark' || (!q.get('theme') && saved === 'dark')) DOC.view.theme = 'dark';
  document.body.dataset.theme = DOC.view.theme;
  V.cursorT = (DOC.view.cursors[0] || { t: 0 }).t;
  readTokens();
  syncName(); bindCanvas(); bindFiles(); bindTopbar(); bindRep();
  handoffFromHash();
  fitAll(false);
  render(); renderValPick(); clearDirty();
  /* 验证钩子：?expsvg=<px/显示单位> → 页面只留一张导出 SVG，headless 对照脚本直接取图。
     M1 用它把「V1 的预览渲染」和「V2 导入同一份 WaveJSON 后的渲染」按同样格宽拼成一张图。 */
  if (q.has('expsvg')) {
    V.zoom = Math.max(MINZOOM, Math.min(MAXZOOM, parseFloat(q.get('expsvg')) || 40)); render();
    const ex = buildExportSvg({ a: DOC.time.t0, b: DOC.time.t1, width: Math.max(1, (DOC.time.t1 - DOC.time.t0) * pxps()) });
    const holder = document.createElement('div');
    holder.id = 'expsvg';
    holder.style.cssText = 'position:fixed;inset:0;z-index:9999;overflow:auto;background:' + TOK.waveBg;
    holder.innerHTML = ex.str;
    document.body.appendChild(holder);            // 不拆 app 本体：resize / render 钩子还会摸 #scroll
    document.title = 'expsvg ' + Math.round(ex.w) + 'x' + Math.round(ex.h);
    return;
  }
  $$('#rail button').forEach(b => b.classList.toggle('on', b.getAttribute('data-tool') === V.tool || (b.getAttribute('data-tool') === 'snap' && V.snap)));
  if (q.get('selftest') === '1') setTimeout(selftest, 60);
  if (q.get('selftest') === '2') setTimeout(uiTest, 120);
}
function bindTopbar() {
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const a = b.getAttribute('data-act');
    if (a === 'theme') { trySet('wy-theme', DOC.view.theme === 'dark' ? 'light' : 'dark'); setTheme(DOC.view.theme === 'dark' ? 'light' : 'dark'); }
    else if (a === 'sample') { snap(); DOC = demoDoc(); afterLoad(); clearDirty(); syncName(); }
    else if (a === 'new') { snap(); DOC = newDoc(); afterLoad(); clearDirty(); syncName(); }
    else if (a === 'open-wy') $('#fileInput').click();
    else if (a === 'export-wj') exportWj();
    else if (a === 'to-v1') goV1();
    else if (a === 'save') doSave(true, false);
    else if (a === 'save-as') doSave(false, true);
    else if (a === 'svg') exportSvg();
    else if (a === 'png2') exportPng(2);
    else if (a === 'png4') exportPng(4);
    else if (a === 'add-sig') {
      const kinds = ['bit', 'bus', 'clock', 'analog'];
      const cur = V.sel ? sigById(V.sel) : null;
      addSig(cur ? kinds[(kinds.indexOf(cur.kind) + 1) % 4] : 'bit');
    }
    else if (a === 'add-group') { snap(); DOC.lanes.push(newGroup('分组' + (DOC.lanes.filter(n => n.lanes).length + 1), [])); render(); markDirty(); }
  });
}
window.addEventListener('beforeunload', ev => { if (V.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
window.WY = { get DOC() { return DOC; }, set DOC(v) { DOC = v; }, V, render, selftest, toWy, fromWy, setRange, laneSegs, valueAt, fmtVal, parseVal,
  newSig, demoDoc, buildExportSvg, allSigs, flat, pngBlob, pngExtractWy, wyText, loadWyText, sigById,
  WJC, parseLoose, wjToDoc, docToWj, wjLabel, loadAnyText, showWjRep, closeWjRep, exportWj, goV1, v1Url, handoffFromHash, WY_HANDOFF_KEY };
